name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest
    name: PHP ${{ matrix.php }} · ${{ matrix.deps }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
        deps: ['lowest', 'highest']
        exclude:
          - php: '8.1'
            deps: 'highest'
          - php: '8.3'
            deps: 'lowest'

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        extensions: mbstring, xml, ctype, json
        coverage: none

    - name: Cache Composer dependencies
      uses: actions/cache@v4
      with:
        path: vendor
        key: ${{ runner.os }}-php${{ matrix.php }}-${{ matrix.deps }}-${{ hashFiles('composer.json') }}
        restore-keys: |
          ${{ runner.os }}-php${{ matrix.php }}-${{ matrix.deps }}-

    - name: Install dependencies
      run: |
        if [ "${{ matrix.deps }}" = "lowest" ]; then
          composer update --prefer-lowest --prefer-stable --no-progress --no-interaction
        else
          composer install --prefer-dist --no-progress --no-interaction
        fi

    - name: Validate composer.json
      run: composer validate --strict

    - name: Run PHPUnit
      run: vendor/bin/phpunit

    - name: Run PHPStan (Level 8)
      run: vendor/bin/phpstan analyse --no-progress

    - name: Run PHPCS (PSR-12)
      run: vendor/bin/phpcs --standard=PSR12 src tests
